<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bambooSteam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="bambooWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="dumplingShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#881337" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="200" height="200" rx="44" fill="#FFF1F2" />
  <rect x="8" y="8" width="184" height="184" rx="36" fill="none" stroke="#FECDD3" stroke-width="2" />
  
  <!-- Bamboo Steamer & Dimsum -->
  <g filter="url(#dumplingShadow)">
    <!-- Steamer Base Rim -->
    <ellipse cx="100" cy="132" rx="60" ry="14" fill="#78350F" />
    <path d="M40 108 H160 V130 C160 140 133 148 100 148 C67 148 40 140 40 130 Z" fill="url(#bambooWood)" />
    <ellipse cx="100" cy="108" rx="60" ry="12" fill="#D97706" stroke="#92400E" stroke-width="2" />

    <!-- Cute Plump Dumpling (Xiao Long Bao) -->
    <path d="M72 108 C68 85 85 70 100 68 C115 70 132 85 128 108 C128 116 116 120 100 120 C84 120 72 116 72 108 Z" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2" />
    <!-- Dumpling Pleats / Folds -->
    <path d="M100 68 Q92 84 86 100" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M100 68 Q100 84 100 102" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M100 68 Q108 84 114 100" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
    <!-- Top Pinch Crown -->
    <circle cx="100" cy="68" r="4.5" fill="#E11D48" />

    <!-- Steam Vapors -->
    <path d="M84 56 Q80 44 86 34" fill="none" stroke="#E11D48" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M100 50 Q96 38 102 26" fill="none" stroke="#BE123C" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
    <path d="M116 56 Q122 44 114 34" fill="none" stroke="#E11D48" stroke-width="3" stroke-linecap="round" opacity="0.7" />

    <!-- Chopsticks Accent -->
    <line x1="42" y1="56" x2="158" y2="44" stroke="#881337" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="100" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="3" fill="#881337" text-anchor="middle">NAGA STEAM</text>
  <text x="100" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" letter-spacing="2" fill="#E11D48" text-anchor="middle">AUTHENTIC ARTISAN DIMSUM</text>
</svg>
